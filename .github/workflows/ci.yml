name: CI

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          # mise の "latest"（v2026.9.3）はリリースアセットが未公開で
          # ダウンロードが 404 になるため、実在する版に固定する。
          version: 2026.9.2
      - run: npm ci
      - run: npm run build
